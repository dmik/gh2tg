name: Release new version

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty for no tag)
        required: false
        default: ""
      force:
        description: Force (allow rewritten history)
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Promote main branch to release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          FORCE_RELEASE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be empty or match vX.Y.Z (for example, v1.2.3)." >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            git check-ref-format "refs/tags/$RELEASE_TAG"
          fi

          git fetch origin main release
          if [[ -n "$RELEASE_TAG" ]]; then
            commit=$(git rev-parse origin/main)
            version=$(git show "$commit:package.json" | sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]*)",?[[:space:]]*$/\1/p')
            if [[ "$version" != "${RELEASE_TAG#v}" ]]; then
              echo "package.json version must be ${RELEASE_TAG#v} for tag $RELEASE_TAG; found '$version'." >&2
              exit 1
            fi

            # Tags are lightweight; use the target commit's date in its recorded timezone.
            date=$(git show -s --format=%cs "$commit")
            header=$(git show "$commit:CHANGES.md" | awk '/^##([[:blank:]]|$)/ && !found++ { sub(/[[:space:]]*$/, ""); print }')
            expected="## $RELEASE_TAG - $date"
            if [[ "$header" != "$expected" ]]; then
              echo "First CHANGES.md release header must be '$expected'; found '$header'." >&2
              exit 1
            fi
          fi

          push_args=(--atomic)
          if [[ "$FORCE_RELEASE" == "true" ]]; then
            push_args+=("--force-with-lease=refs/heads/release:$(git rev-parse origin/release)")
          else
            git merge-base --is-ancestor origin/release origin/main
          fi
          push_args+=(origin origin/main:refs/heads/release)
          if [[ -n "$RELEASE_TAG" ]]; then
            git tag -- "$RELEASE_TAG" origin/main
            push_args+=("refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG")
          fi
          git push "${push_args[@]}"
