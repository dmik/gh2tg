name: Release new version

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty for no tag)
        required: false
        default: ""
      force:
        description: Force (allow rewritten history)
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Promote main branch to release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          FORCE_RELEASE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be empty or match vN.N.N (for example, v1.2.3)." >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            git check-ref-format "refs/tags/$RELEASE_TAG"
          fi
          git fetch origin main release
          push_args=(--atomic)
          if [[ "$FORCE_RELEASE" == "true" ]]; then
            push_args+=("--force-with-lease=refs/heads/release:$(git rev-parse origin/release)")
          else
            git merge-base --is-ancestor origin/release origin/main
          fi
          push_args+=(origin origin/main:refs/heads/release)
          if [[ -n "$RELEASE_TAG" ]]; then
            git tag -- "$RELEASE_TAG" origin/main
            push_args+=("refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG")
          fi
          git push "${push_args[@]}"
